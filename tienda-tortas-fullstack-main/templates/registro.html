<!DOCTYPE html>
<html>
<head>
    <title>Registro - Pastelería</title>
    <style>
        body { font-family: Arial; background: #FFF0F5; }
        .form-container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px #D8BFD8;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #D8BFD8;
            border-radius: 10px;
        }
        button {
            background: #8A2BE2;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
        }
        h2 { color: #8A2BE2; text-align: center; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>📝 Crear cuenta</h2>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
        <p style="text-align:center; margin-top:20px;">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </div>
</body>
</html>
