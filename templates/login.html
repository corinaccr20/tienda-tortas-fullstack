<!DOCTYPE html>
<html>
<head>
    <title>Login - Pastelería Dulce Sueño</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo con gradiente y un patrón de puntos sutil */
            background-color: #FFF0F5;
            background-image: radial-gradient(#D8BFD8 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(138, 43, 226, 0.15);
            border: 1px solid #F3E5F5;
            position: relative;
            overflow: hidden;
        }

        /* Adorno superior del formulario */
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #FF69B4, #8A2BE2);
        }

        h2 {
            color: #8A2BE2;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px; /* Espacio a la izquierda para el icono */
            border: 2px solid #F3E5F5;
            border-radius: 12px;
            font-size: 1rem;
            color: #555;
            background: #FAFAFA;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: #FF69B4;
            background: white;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
        }

        /* Iconos dentro de los inputs (usando emojis como truco) */
        .input-group::before {
            content: '✉️';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0.6;
        }

        .input-group.password::before {
            content: '🔒';
        }

        button {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #8A2BE2, #4B0082);
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(138, 43, 226, 0.4);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 0.95rem;
        }

        .footer-text a {
            color: #FF69B4;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .footer-text a:hover {
            color: #8A2BE2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🔐 Iniciar sesión</h2>
        <form method="POST">
            <div class="input-group">
                <input type="email" name="email" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group password">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p class="footer-text">¿Nueva? <a href="/registro">Regístrate aquí</a></p>
    </div>
</body>
</html>
